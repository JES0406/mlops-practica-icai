apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-api-deployment
  labels:
    app: mlops-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-api
  template:
    metadata:
      labels:
        app: mlops-api
    spec:
      containers:
      - name: mlops-api
        image: gcr.io/mlops-icai-a2265f/mlops-api:latest
        ports:
        # Puerto con nombre: el PodMonitoring de Managed Prometheus lo referencia por "metrics"
        - name: metrics
          containerPort: 5000
        # Ready solo cuando Flask ya escucha (cargar sklearn + modelo tarda unos segundos);
        # sin esto el rollout termina antes y el smoke test recibe "Connection refused"
        readinessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: 2
          periodSeconds: 2
