name: MLOps with CML

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: DVC and Python setup
        uses: iterative/setup-dvc@175771be1dc3d119268e00a896b52a4b77decb5e # v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config --global user.email "JES0406@users.noreply.github.com"
          git config --global user.name "JES0406"

      - name: Restore DVC Cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/dvc
          key: dvc-cache-${{ hashFiles('dvc.yaml', 'dvc.lock') }}
          restore-keys: |
            dvc-cache-

      - name: DVC Pull
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_API_KEY: ${{ secrets.DAGSHUB_API_KEY }}
        # Las credenciales de Dagshub son necesarias para acceder al almacenamiento remoto
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_API_KEY
          dvc pull -r origin

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml
          pip install -r requirements.txt

      # setup-cml instala @dvcorg/cml con npm; con el Node 22 del runner falla al compilar canvas
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX TEMPORAL BUG ACTIONS CML: instalar CML a mano en vez de iterative/setup-cml
      - name: Install CML manually
        run: |
          npm install -g @dvcorg/cml

      - name: Run training script
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_API_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'https://dagshub.com/JES0406/mlops-practica-icai.mlflow' }}
        run: |
          # DVC repro ejecutará la etapa "train" y, por lo tanto, el script train.py.
          dvc repro

      - name: CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Métricas" > report.md
          dvc metrics show --md >> report.md
          echo "## Parámetros" >> report.md
          dvc params diff --all --md >> report.md
          echo "## Matriz de confusión" >> report.md
          # El servicio de imágenes de CML (asset.cml.dev) ya no responde: la imagen
          # se sube como artifact del workflow y queda registrada en MLflow
          echo "Ver artifact \`confusion-matrix\` del workflow y el run en MLflow (DagsHub)." >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cml comment create report.md

      - name: Upload confusion matrix
        uses: actions/upload-artifact@v4
        with:
          name: confusion-matrix
          path: confusion_matrix.png

  deploy-to-gke:
    needs: train-and-report
    # En un PR el workflow se dispara dos veces (push + pull_request): desplegar solo en push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: DVC and Python setup
        uses: iterative/setup-dvc@175771be1dc3d119268e00a896b52a4b77decb5e # v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI and kubectl
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          version: 'latest'
          install_components: 'gke-gcloud-auth-plugin,kubectl'

      - name: Get GKE credentials
        env:
          CLOUDSDK_CONTAINER_USE_APPLICATION_DEFAULT_CREDENTIALS: true
        run: gcloud container clusters get-credentials ${{ vars.GKE_CLUSTER }} --zone ${{ vars.GKE_ZONE }} --project ${{ vars.GCP_PROJECT_ID }}

      - name: DVC Pull
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_API_KEY: ${{ secrets.DAGSHUB_API_KEY }}
        # Las credenciales de Dagshub son necesarias para acceder al almacenamiento remoto
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_API_KEY
          dvc pull -r origin

      - name: Configure Docker to use GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/${{ vars.GCP_PROJECT_ID }}/mlops-api:latest .
          docker push gcr.io/${{ vars.GCP_PROJECT_ID }}/mlops-api:latest

      - name: Deploy to GKE
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          # :latest no cambia el spec -> forzar que los pods vuelvan a descargar la imagen
          kubectl rollout restart deployment/mlops-api-deployment
          kubectl rollout status deployment/mlops-api-deployment --timeout=180s
